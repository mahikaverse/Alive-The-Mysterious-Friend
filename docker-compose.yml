services:
  alive:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: cached
      - chromadldata:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - alive-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alive
      POSTGRES_PASSWORD: alive
      POSTGRES_DB: alive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alive"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - alive-net

volumes:
  pgdata:
  chromadldata:

networks:
  alive-net:
    driver: bridge
